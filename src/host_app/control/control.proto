syntax = "proto3";

package modlock.host_app.control;

option go_package = "github.com/paralin/modlock/src/host_app/control;control";

import "github.com/paralin/modlock/src/wasm/players/players.proto";
import "github.com/paralin/modlock/src/wasm/profile/profile.proto";
import "github.com/paralin/modlock/src/wasm/ui/ui.proto";

// The control link connects modlock-host to the program that started it. The
// host dials the address given with --control; then the controller sends
// ControlRequest messages and the host sends HostEvent messages, each framed
// by its length as a little-endian uint32. The link lasts for the host's
// lifetime; the host keeps running when the controller disconnects.

// ControlRequest is one request from the controller.
message ControlRequest {
  // Body selects the request.
  oneof body {
    // Reload replaces a running mod with a new build.
    ReloadRequest reload = 1;

    // Roles replaces the players' roles, which mods read on each Connection.
    modlock.wasm.players.RolesTable roles = 2;

    // Service installs a cached service answer and reloads its mod to adopt it.
    ServiceReply service = 3;

    // Call calls a service a running mod serves; the host answers with a
    // Called event.
    ModCall call = 4;

    // Answer ends one ServiceCall the host forwarded.
    ServiceAnswer answer = 5;
  }
}

// ModCall calls one method of a service a running mod serves, on the game's
// thread between frames. Only the controller can send it; no player can.
message ModCall {
  // Mod is the running mod's slug.
  string mod = 1;
  // Service and Method select the call, such as the library's "console"
  // service and its "run" method.
  string service = 2;
  string method = 3;
  // Payload is the call's encoded request, opaque to the host.
  bytes payload = 4;
  // Id identifies this call in its result, opaque to the host.
  string id = 5;
}

// ModCallResult answers one ModCall.
message ModCallResult {
  // Id matches the ModCall this result answers.
  string id = 1;
  // Mod is the mod that was called.
  string mod = 2;
  // Payload is the mod's encoded answer.
  bytes payload = 3;
  // Error says why the call failed: no such mod is running, the mod serves
  // no such service, or its handler failed. It is empty on success.
  string error = 4;
}

// ReloadRequest replaces one mod in place. The mod keeps its place among the
// host's plugins; its old instance stops and the new build starts.
message ReloadRequest {
  // Path is the built mod to load: a directory with mod.json or a .wasm file,
  // as the host sees it.
  string path = 1;
}

// HostEvent is one thing that happened in the host.
message HostEvent {
  // Body selects the event.
  oneof body {
    // Started reports a mod that started or restarted after a reload.
    ModStarted started = 1;

    // Log carries one line a mod logged.
    ModLog log = 2;

    // Failed reports a mod that stopped or a reload that did not load.
    ModFailed failed = 3;

    // Joined reports a player who finished joining the server.
    PlayerJoined joined = 4;

    // Ready reports that players can join the server.
    ServerReady ready = 5;

    // Ui carries a change to the interface a mod shows a player. The host
    // sends every tree as a reset change when the call opens.
    UiChanged ui = 6;

    // Left reports a player who left the server.
    PlayerLeft left = 7;

    // Message carries a message a mod showed a player: a chat line, center
    // text or an announcement.
    PlayerMessage message = 8;

    // Chat carries a line a player said in chat.
    PlayerChat chat = 9;

    // Calls counts the host calls a mod made since its last report, about
    // once a minute while it calls and when its build stops.
    ModCalls calls = 10;

    // SlowFrame reports the slowest frame a mod ran since its last report and
    // the functions it spent the time in, about once a minute while the mod
    // runs slow.
    ModSlowFrame slow_frame = 11;
    // ServiceApplied confirms whether a controller configuration started.
    ServiceResult service_applied = 12;

    // Called answers a ModCall.
    ModCallResult called = 13;

    // ServiceCall asks the controller to answer a mod's started call to a
    // service the fixtures forward; an Answer with its id ends it.
    ServiceCall service_call = 14;
  }
}

// PlayerChat is a line a player said in chat, to everyone or to their team.
message PlayerChat {
  // Slot is the speaker's slot.
  int32 slot = 1;

  // Name is the speaker's name.
  string name = 2;

  // Text is what they said.
  string text = 3;
}

// ModStarted identifies a mod that started.
message ModStarted {
  // Mod is the mod's name.
  string mod = 1;

  // Reloaded is true when a reload replaced an earlier instance.
  bool reloaded = 2;
}

// ModLog carries one log line.
message ModLog {
  // Mod is the name of the mod that logged.
  string mod = 1;

  // Text is the line, without a trailing newline.
  string text = 2;
}

// ModFailed explains why a mod stopped or a reload failed. A failed reload
// leaves the previous instance running.
message ModFailed {
  // Mod is the mod's name.
  string mod = 1;

  // Error describes the failure.
  string error = 2;
}

// ModCalls is one report of the host calls a mod made.
message ModCalls {
  // Mod is the mod's name.
  string mod = 1;

  // Profile counts the calls since the mod's last report.
  modlock.wasm.profile.CallProfile profile = 2;
}

// ModSlowFrame is one report of a mod's slow frames.
message ModSlowFrame {
  // Mod is the mod's name.
  string mod = 1;

  // Report is the slowest frame since the mod's last report.
  modlock.wasm.profile.SlowFrame report = 2;
}

// PlayerJoined identifies a player who joined.
message PlayerJoined {
  // Slot is the player's slot.
  int32 slot = 1;

  // Name is the player's name.
  string name = 2;

  // SteamId is the player's Steam ID, zero for a bot.
  fixed64 steam_id = 3;
}

// PlayerLeft identifies a player who left. Bots leave too; a controller drops
// a slot it never saw join.
message PlayerLeft {
  // Slot is the player's former slot.
  int32 slot = 1;
}

// PlayerMessage is a message a mod showed one player.
message PlayerMessage {
  // Mod is the name of the mod that showed it.
  string mod = 1;

  // Slot identifies the player.
  int32 slot = 2;

  // Kind is where the message shows.
  MessageKind kind = 3;

  // Title heads an announcement.
  string title = 4;

  // Text is the message; empty center text clears it.
  string text = 5;
}

// MessageKind is where a message shows on the player's screen.
enum MessageKind {
  // MESSAGE_KIND_CHAT is a line in chat.
  MESSAGE_KIND_CHAT = 0;

  // MESSAGE_KIND_CENTER is the text in the center of the screen.
  MESSAGE_KIND_CENTER = 1;

  // MESSAGE_KIND_ANNOUNCEMENT is a game announcement with a title.
  MESSAGE_KIND_ANNOUNCEMENT = 2;
}

// ServerReady reports the loaded map.
message ServerReady {
  // Map is the map the server loaded.
  string map = 1;
}

// UiChanged carries a change to the interface a mod shows a player.
message UiChanged {
  // Mod is the mod's name.
  string mod = 1;

  // Slot identifies the player.
  int32 slot = 2;

  // Change updates the player's tree for the mod.
  modlock.wasm.ui.Change change = 3;
}

// ServiceReply supplies a host extension's answer for one mod. The controller
// sends it only when an applied configuration changes; the mod restarts after
// the host installs the answer.
message ServiceReply {
  // Mod is the running mod's slug.
  string mod = 1;
  // Service and Method select the extension call this answer serves.
  string service = 2;
  string method = 3;
  // Payload is the service's encoded answer, opaque to Modlock.
  bytes payload = 4;
  // Path is the local build to reload after installing the answer.
  string path = 5;
  // Id identifies this applied configuration, opaque to the host.
  string id = 6;
}

// ServiceResult acknowledges adoption of one cached service configuration.
message ServiceResult {
  // Id matches the ServiceReply this result confirms.
  string id = 1;
  // Error is empty when the mod restarted with the new configuration.
  string error = 2;
}

// Fixture is one method's reply from a mod project's service fixture, which
// the controller hands the host at start so the mod's first frame can call it.
message Fixture {
  // Mod is the slug of the mod the reply answers.
  string mod = 1;
  // Service and Method select the call this reply answers.
  string service = 2;
  string method = 3;
  // Payload is the reply's bytes, opaque to Modlock.
  bytes payload = 4;
  // Source names the fixture file, for the host's log.
  string source = 5;
}

// Forward hands one mod's started calls of a service to the controller over
// the control link, in place of a fixture.
message Forward {
  // Mod is the slug of the mod whose calls go to the controller.
  string mod = 1;
  // Service names the service forwarded.
  string service = 2;
  // Target names where the controller sends the calls, for the host's log.
  string target = 3;
}

// Fixtures is the file --fixtures names: every fixture reply of the mods the
// host loads, and the services the controller answers instead.
message Fixtures {
  repeated Fixture fixtures = 1;
  repeated Forward forwards = 2;
}

// ServiceCall is one started call of a forwarded service, for the controller
// to answer.
message ServiceCall {
  // Id names the call in the Answer that ends it.
  uint64 id = 1;
  // Mod is the slug of the calling mod.
  string mod = 2;
  // Service and Method select the call.
  string service = 3;
  string method = 4;
  // Payload is the call's bytes, opaque to Modlock.
  bytes payload = 5;
}

// ServiceAnswer ends one forwarded ServiceCall with its reply or an error.
message ServiceAnswer {
  // Id matches the ServiceCall it ends.
  uint64 id = 1;
  // Payload is the reply's bytes when Error is empty.
  bytes payload = 2;
  // Error, when set, fails the call with this text.
  string error = 3;
}
