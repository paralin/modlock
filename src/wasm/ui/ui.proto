syntax = "proto3";

package modlock.wasm.ui;

option go_package = "github.com/paralin/modlock/src/wasm/ui;ui";

// A mod describes each player's interface as a tree of nodes. The renderer in
// the player's game draws each mod's tree under a root of its own with stock
// panels, so no mod code runs in the client. Every property is typed: the
// renderer writes nothing a mod could turn into script, a style string or a
// console command. The one exception is a layout node, which a host's
// renderer may load from the mod's own content addon and which Modlock's
// renderer leaves empty.

// Node is one panel in a tree. The root's id is empty; it is a full-screen
// panel that lets clicks through to the game.
message Node {
  // Id names the node within its tree.
  string id = 1;

  // Kind selects the panel the node draws.
  Kind kind = 2;

  // Children lists the ids of the node's children in drawing order. A node
  // that no parent lists is not drawn.
  repeated string children = 3;

  // Text is a label's words.
  string text = 4;

  // Image is an image's path in the game's content, such as
  // "file://{images}/heroes/wraith_card.psd".
  string image = 5;

  // Style lays out and paints the node.
  Style style = 6;

  // Layout is a layout's path within the mod's content addon, such as
  // "inventory.xml": one or more segments of letters, digits, '_', '-' and
  // '.', none of them "..", ending in ".xml".
  string layout = 7;

  // Data is the JSON value a layout's script reads, or a route's value. The
  // renderer sets a layout's data as the modlock_data attribute of its panel
  // before loading the layout, and each route as the attribute
  // modlock_route_<route> of every layout of the mod. After a draw that
  // changes any of them it plays the sound event "modlock_data_changed",
  // which no sound has, so a script that registers for the unhandled
  // PlaySoundEffect event hears it and reads its attributes again. The
  // Panorama library scripts/modlock/layout.js does both for a layout.
  string data = 8;

  // HideHud lists the parts of the game's own HUD the renderer hides while
  // the root holds them; only the root's list counts. A part shows again once
  // no mod's root lists it, so a mod that stops, a reset and a player who
  // leaves all bring it back.
  repeated HudPart hide_hud = 9;

  // Route names a route node's data route: one or more letters, digits, '_',
  // '-' and '.'.
  string route = 10;

  // Hover is the style drawn over the node's style while the pointer is over
  // it. Each property it sets returns to the node's own value, or to the
  // property's resting value, when the pointer leaves. A node with a hover
  // style takes the pointer, so the game behind it does not.
  Style hover = 11;

  // Tooltip is the text the game's tooltip shows while the pointer is over the
  // node. A node with a tooltip takes the pointer.
  string tooltip = 12;

  // Sound is the game's sound event a button plays when pressed, such as
  // "UI.MainMenu.Activate": one or more letters, digits, '_', '-' and '.'.
  string sound = 13;

  // HoverSound is the game's sound event played as the pointer enters the
  // node, named as sound is.
  string hover_sound = 14;

  // Disabled keeps a button from taking presses; its style shows why.
  bool disabled = 15;

  // Scaling fits an image or a hero's portrait into the node's box.
  Scaling scaling = 16;

  // Hero is a hero image's hero, by the game's hero id.
  int32 hero = 17;

  // HeroLook picks which of the game's pictures of the hero a hero image
  // draws.
  HeroLook hero_look = 18;

  // Input is the control an input node draws and the value it holds. Each
  // change the player makes reaches the mod as a UiInputEvent, which the host
  // checks against the control: a slider's range and step, a dropdown's
  // options, an entry's length. The renderer keeps the player's own edit
  // until a draw changes the value the node holds, so the mod's value is the
  // truth and a redraw for another reason does not undo a change in flight.
  oneof input {
    TextEntry text_entry = 19;
    Slider slider = 20;
    Toggle toggle = 21;
    Dropdown dropdown = 22;
  }

  // Token draws a label in the player's language: a token of the game's
  // localization, such as "#Citadel_HeroName_Haze", shown in place of text.
  // It is '#' then one or more letters, digits, '_', '-' and '.'.
  string token = 23;

  // Variables fill the {s:name} places in a localized label's token.
  map<string, string> variables = 24;

  // SteamId is an avatar's player, by Steam id.
  fixed64 steam_id = 25;

  // Enter is the style a node's new panel starts from. The node's transition
  // eases it from there to the node's style, so it fades, slides or grows
  // in.
  Style enter = 26;

  // Exit is the style a node's panel eases to, over its transition, when the
  // node leaves the tree; the panel goes once the transition ends.
  Style exit = 27;

  // Cycle repeats a change to the node's style while it shows, such as a
  // pulse or a blink.
  Cycle cycle = 28;
}

// Scaling fits a picture into its node's box.
enum Scaling {
  // SCALING_DEFAULT keeps the panel's own scaling: an image fits its box,
  // keeping its shape.
  SCALING_DEFAULT = 0;

  // SCALING_FIT shows the whole picture in the box, keeping its shape.
  SCALING_FIT = 1;

  // SCALING_COVER fills the box, keeping the picture's shape and cropping what
  // falls outside.
  SCALING_COVER = 2;

  // SCALING_STRETCH fills the box, stretching the picture.
  SCALING_STRETCH = 3;

  // SCALING_FIT_WIDTH fits the picture's width to the box, keeping its shape.
  SCALING_FIT_WIDTH = 4;

  // SCALING_FIT_HEIGHT fits the picture's height to the box, keeping its
  // shape.
  SCALING_FIT_HEIGHT = 5;

  // SCALING_NONE draws the picture at its own size.
  SCALING_NONE = 6;
}

// HeroLook is one of the game's pictures of a hero.
enum HeroLook {
  // HERO_LOOK_SMALL is the square portrait of the kill feed and scoreboard.
  HERO_LOOK_SMALL = 0;

  // HERO_LOOK_CARD is the tall card the hero picker shows.
  HERO_LOOK_CARD = 1;

  // HERO_LOOK_ICON is the hero's round icon.
  HERO_LOOK_ICON = 2;

  // HERO_LOOK_VERTICAL is the narrow portrait of the hero grid.
  HERO_LOOK_VERTICAL = 3;

  // HERO_LOOK_TOP_BAR is the portrait in the bar across the top of the HUD.
  HERO_LOOK_TOP_BAR = 4;

  // HERO_LOOK_MINIMAP is the hero's minimap icon.
  HERO_LOOK_MINIMAP = 5;
}

// HudPart is a part of the game's own HUD a mod may hide from a player.
enum HudPart {
  // HUD_PART_UNKNOWN names no part.
  HUD_PART_UNKNOWN = 0;

  // HUD_PART_LEVEL_UP is the notice the game shows for each boon, ability
  // point and power increase.
  HUD_PART_LEVEL_UP = 1;

  // HUD_PART_OWN_HEALTH is the player's own health bar, with its shields and
  // regeneration, beside their abilities. The abilities, held items, status
  // icons and crosshair stay.
  HUD_PART_OWN_HEALTH = 2;

  // HUD_PART_TOP_BAR is the bar across the top of the screen: the team
  // scores, the hero portraits and the match clock. Chat stays.
  HUD_PART_TOP_BAR = 3;

  // HUD_PART_AMMO is the player's ammo: the clip ring and count around the
  // crosshair and the low and out of ammo warnings. The crosshair stays.
  HUD_PART_AMMO = 4;

  // HUD_PART_SOULS is the player's souls and level readout beside their
  // health. The abilities, items and health bar stay.
  HUD_PART_SOULS = 5;

  // HUD_PART_MINIMAP is the minimap with its hints and district name.
  HUD_PART_MINIMAP = 6;

  // HUD_PART_ABILITIES is the bar of the player's abilities and active items.
  // The health bar, souls, held items and crosshair stay.
  HUD_PART_ABILITIES = 7;
}

// Kind selects the panel a node draws.
enum Kind {
  // KIND_PANEL groups and lays out its children.
  KIND_PANEL = 0;

  // KIND_LABEL shows text.
  KIND_LABEL = 1;

  // KIND_IMAGE shows an image.
  KIND_IMAGE = 2;

  // KIND_BUTTON holds its children and reports each press to the mod. A
  // button takes clicks only while the player has a cursor.
  KIND_BUTTON = 3;

  // KIND_LAYOUT loads the node's layout from the mod's content addon, whose
  // script runs in the player's game and talks to the mod through its own
  // console commands. Only a host that has reviewed the mod's content loads
  // it; Modlock's renderer draws an empty panel.
  KIND_LAYOUT = 4;

  // KIND_ROUTE draws nothing: it hands its data to every layout of the mod
  // under its route's name. No parent lists it.
  KIND_ROUTE = 5;

  // KIND_HERO_IMAGE shows one of the game's pictures of the node's hero.
  KIND_HERO_IMAGE = 6;

  // KIND_INPUT takes a value from the player in the control its input names.
  // An input takes clicks only while the player has a cursor.
  KIND_INPUT = 7;

  // KIND_AVATAR shows the Steam picture of the player its steam_id names.
  KIND_AVATAR = 8;
}

// TextEntry is a box the player types a line of text into.
message TextEntry {
  // Text is the box's text.
  string text = 1;

  // Placeholder is the faint text an empty box shows.
  string placeholder = 2;

  // MaxLength bounds the text, in characters; zero means 100. The host takes
  // at most 240 bytes of text, so a console line carries it.
  uint32 max_length = 3;
}

// Slider is a bar the player drags to a number.
message Slider {
  // Value is the number the slider holds.
  float value = 1;

  // Min and Max bound the value; a max no greater than min means 0 to 1.
  float min = 2;
  float max = 3;

  // Step is the distance between the values the slider stops at; zero lets
  // it stop anywhere.
  float step = 4;
}

// Toggle is a box the player checks or clears. The node's text labels it.
message Toggle {
  // On reports whether the box is checked.
  bool on = 1;
}

// Dropdown lets the player pick one of a list of options.
message Dropdown {
  // Options are the choices, as the player reads them.
  repeated string options = 1;

  // Selected is the index of the chosen option.
  uint32 selected = 2;
}

// Cycle alternates a node between its style and another, easing each way.
message Cycle {
  // Style is the style laid over the node's own at the far end of the cycle.
  Style style = 1;

  // Seconds is how long each way takes.
  float seconds = 2;

  // Count is how many times the node goes there and back; zero repeats while
  // it shows.
  uint32 count = 3;
}

// Style is the closed set of layout and paint properties a node may set. A
// zero value leaves the panel's default.
message Style {
  // Width is the node's width.
  Length width = 1;

  // Height is the node's height.
  Length height = 2;

  // Flow arranges the node's children.
  Flow flow = 3;

  // HorizontalAlign places the node within its parent's width.
  Align horizontal_align = 4;

  // VerticalAlign places the node within its parent's height.
  Align vertical_align = 5;

  // Margin is the space outside the node, in pixels.
  Edges margin = 6;

  // Padding is the space between the node's edge and its children, in pixels.
  Edges padding = 7;

  // Background is the fill color as 0xRRGGBBAA; zero is transparent.
  fixed32 background = 8;

  // Color is the text color as 0xRRGGBBAA; zero keeps the default.
  fixed32 color = 9;

  // FontSize is the text size in pixels; zero keeps the default.
  float font_size = 10;

  // Bold sets bold text.
  bool bold = 11;

  // TextAlign places text within a label.
  Align text_align = 12;

  // BorderRadius rounds the corners, in pixels.
  float border_radius = 13;

  // Opacity fades the node and its children, from 0 to 1; unset is opaque.
  optional float opacity = 14;

  // Face is the text's typeface, one of the game's own.
  Face face = 15;

  // Uppercase sets the text in capitals.
  bool uppercase = 16;

  // LetterSpacing widens the space between letters, in pixels.
  float letter_spacing = 17;

  // Shadow draws a soft drop shadow under the text, which keeps it readable
  // over the world.
  bool shadow = 18;

  // BorderWidth is the width of a line around the node's edge, in pixels.
  float border_width = 19;

  // BorderColor is the edge line's color as 0xRRGGBBAA. The line is drawn
  // only when both its width and its color are set.
  fixed32 border_color = 20;

  // X and Y place the node at an offset from its parent's top left corner,
  // in pixels or a percent of the parent, outside the parent's flow.
  Length x = 21;
  Length y = 22;

  // MinWidth, MaxWidth, MinHeight and MaxHeight bound the node's size.
  Length min_width = 23;
  Length max_width = 24;
  Length min_height = 25;
  Length max_height = 26;

  // ZIndex draws the node above its siblings with a lower index; zero keeps
  // the drawing order.
  int32 z_index = 27;

  // OverflowX and OverflowY decide what happens to children that do not fit
  // across and down.
  Overflow overflow_x = 28;
  Overflow overflow_y = 29;

  // Gradient fills the node with a gradient in place of its background.
  Gradient gradient = 30;

  // BoxShadow draws a shadow around or inside the node's box.
  Shadow box_shadow = 31;

  // TextShadow draws this shadow under the text in place of shadow's.
  Shadow text_shadow = 32;

  // Tint washes the node and its children with a color as 0xRRGGBBAA, which
  // recolors a white icon; zero leaves them.
  fixed32 tint = 33;

  // Saturation, Brightness and Contrast scale the node's colors; 1 leaves
  // them, unset leaves them.
  optional float saturation = 34;
  optional float brightness = 35;
  optional float contrast = 36;

  // Blur blurs the node and its children by a radius in pixels.
  float blur = 37;

  // Italic slants the text.
  bool italic = 38;

  // Weight sets the text's weight in place of bold.
  Weight weight = 39;

  // LineHeight is the height of each line of text, in pixels.
  float line_height = 40;

  // NoWrap keeps the text on one line.
  bool no_wrap = 41;

  // TextOverflow decides what text that does not fit its box does.
  TextOverflow text_overflow = 42;

  // Decoration draws a line under or through the text.
  Decoration decoration = 43;

  // Transform moves, scales and rotates the node as drawn, without moving its
  // neighbors.
  Transform transform = 44;

  // Transition animates each change to the node's style, and the move to and
  // from its hover style, instead of snapping to it.
  Transition transition = 45;
}

// Overflow decides what happens to children that do not fit a node.
enum Overflow {
  // OVERFLOW_DEFAULT keeps the panel's own behavior: they shrink to fit.
  OVERFLOW_DEFAULT = 0;

  // OVERFLOW_SQUISH shrinks the children to fit.
  OVERFLOW_SQUISH = 1;

  // OVERFLOW_CLIP cuts off what does not fit.
  OVERFLOW_CLIP = 2;

  // OVERFLOW_SCROLL lets the player scroll to what does not fit.
  OVERFLOW_SCROLL = 3;

  // OVERFLOW_SHOW draws what does not fit outside the node.
  OVERFLOW_SHOW = 4;
}

// Gradient blends colors across a node.
message Gradient {
  // Shape is the direction or shape the colors run in.
  GradientShape shape = 1;

  // Stops are the colors and where each sits, in order.
  repeated GradientStop stops = 2;
}

// GradientShape is the direction or shape a gradient's colors run in.
enum GradientShape {
  // GRADIENT_SHAPE_DOWN runs from the top to the bottom.
  GRADIENT_SHAPE_DOWN = 0;

  // GRADIENT_SHAPE_RIGHT runs from the left to the right.
  GRADIENT_SHAPE_RIGHT = 1;

  // GRADIENT_SHAPE_UP runs from the bottom to the top.
  GRADIENT_SHAPE_UP = 2;

  // GRADIENT_SHAPE_LEFT runs from the right to the left.
  GRADIENT_SHAPE_LEFT = 3;

  // GRADIENT_SHAPE_RADIAL runs from the center out to the edges.
  GRADIENT_SHAPE_RADIAL = 4;
}

// GradientStop is one color of a gradient.
message GradientStop {
  // At is where the color sits along the gradient, from 0 to 1.
  float at = 1;

  // Color is the color as 0xRRGGBBAA.
  fixed32 color = 2;
}

// Shadow is a soft shadow under text or around a box.
message Shadow {
  // X and Y offset the shadow, in pixels.
  float x = 1;
  float y = 2;

  // Blur softens the shadow's edge, in pixels.
  float blur = 3;

  // Spread grows a box's shadow, in pixels, or strengthens a text shadow.
  float spread = 4;

  // Color is the shadow's color as 0xRRGGBBAA.
  fixed32 color = 5;

  // Inset draws a box's shadow inside its edge.
  bool inset = 6;
}

// Weight is a text weight, as the game's faces draw them.
enum Weight {
  // WEIGHT_DEFAULT keeps the panel's weight, or bold's.
  WEIGHT_DEFAULT = 0;
  WEIGHT_THIN = 1;
  WEIGHT_LIGHT = 2;
  WEIGHT_NORMAL = 3;
  WEIGHT_MEDIUM = 4;
  WEIGHT_SEMI_BOLD = 5;
  WEIGHT_BOLD = 6;
  WEIGHT_BLACK = 7;
}

// TextOverflow decides what text that does not fit its box does.
enum TextOverflow {
  // TEXT_OVERFLOW_DEFAULT keeps the panel's behavior.
  TEXT_OVERFLOW_DEFAULT = 0;

  // TEXT_OVERFLOW_ELLIPSIS ends the text that fits with an ellipsis.
  TEXT_OVERFLOW_ELLIPSIS = 1;

  // TEXT_OVERFLOW_SHRINK makes the text smaller until it fits.
  TEXT_OVERFLOW_SHRINK = 2;

  // TEXT_OVERFLOW_CLIP cuts the text off at the box's edge.
  TEXT_OVERFLOW_CLIP = 3;
}

// Decoration draws a line under or through text.
enum Decoration {
  // DECORATION_NONE draws no line.
  DECORATION_NONE = 0;

  // DECORATION_UNDERLINE draws a line under the text.
  DECORATION_UNDERLINE = 1;

  // DECORATION_STRIKE draws a line through the text.
  DECORATION_STRIKE = 2;
}

// Transform moves, scales and rotates a node as drawn.
message Transform {
  // TranslateX and TranslateY move the node, in pixels.
  float translate_x = 1;
  float translate_y = 2;

  // ScaleX and ScaleY scale the node; unset is 1.
  optional float scale_x = 3;
  optional float scale_y = 4;

  // Rotate turns the node clockwise, in degrees.
  float rotate = 5;

  // OriginX and OriginY are the point the node scales and turns about, as a
  // percent of its size; unset is its center.
  optional float origin_x = 6;
  optional float origin_y = 7;
}

// Transition animates a node's style changes.
message Transition {
  // Seconds is how long each change takes.
  float seconds = 1;

  // Delay is how long each change waits before it starts, in seconds.
  float delay = 2;

  // Easing shapes the change's speed over its time.
  Easing easing = 3;
}

// Easing shapes an animation's speed over its time.
enum Easing {
  // EASING_EASE_OUT starts fast and settles.
  EASING_EASE_OUT = 0;

  // EASING_EASE_IN starts slow and speeds up.
  EASING_EASE_IN = 1;

  // EASING_EASE_IN_OUT starts and ends slow.
  EASING_EASE_IN_OUT = 2;

  // EASING_LINEAR keeps one speed.
  EASING_LINEAR = 3;
}

// Face is one of the game's typefaces.
enum Face {
  // FACE_DEFAULT keeps the panel's typeface.
  FACE_DEFAULT = 0;

  // FACE_BODY is the game's text face, Retail Demo.
  FACE_BODY = 1;

  // FACE_BLOCK is the game's heading face, VALVEPulp, which draws the match
  // clock and round titles.
  FACE_BLOCK = 2;

  // FACE_SERIF is the game's menu face, Reaver.
  FACE_SERIF = 3;
}

// Length is a size along one axis.
message Length {
  // Value selects the unit.
  oneof value {
    // Pixels is a fixed size.
    float pixels = 1;

    // Percent is a share of the parent's size, from 0 to 100.
    float percent = 2;

    // FitChildren sizes the node to its children.
    bool fit_children = 3;

    // Fill shares the space left in the parent's flow by this weight.
    float fill = 4;
  }
}

// Flow arranges a node's children.
enum Flow {
  // FLOW_NONE stacks children on top of each other.
  FLOW_NONE = 0;

  // FLOW_DOWN places children in a column.
  FLOW_DOWN = 1;

  // FLOW_RIGHT places children in a row.
  FLOW_RIGHT = 2;

  // FLOW_DOWN_WRAP places children in columns, starting a new column where
  // one is full.
  FLOW_DOWN_WRAP = 3;

  // FLOW_RIGHT_WRAP places children in rows, starting a new row where one is
  // full.
  FLOW_RIGHT_WRAP = 4;
}

// Align places a node or text along one axis.
enum Align {
  // ALIGN_START places it at the left or top.
  ALIGN_START = 0;

  // ALIGN_CENTER centers it.
  ALIGN_CENTER = 1;

  // ALIGN_END places it at the right or bottom.
  ALIGN_END = 2;
}

// Edges are pixel distances on each side.
message Edges {
  // Top is the distance on the top side.
  float top = 1;

  // Right is the distance on the right side.
  float right = 2;

  // Bottom is the distance on the bottom side.
  float bottom = 3;

  // Left is the distance on the left side.
  float left = 4;
}

// Change updates one player's tree. Reset clears the tree first; then each
// node in set replaces the node with its id, and each id in removed drops
// that node.
message Change {
  // Reset clears the tree before the rest of the change applies.
  bool reset = 1;

  // Set holds the new or changed nodes.
  repeated Node set = 2;

  // Removed holds the ids of the nodes to drop.
  repeated string removed = 3;
}

// Tree is one mod's whole tree for one player.
message Tree {
  // Mod is the mod's name.
  string mod = 1;

  // Nodes holds every node, the root included.
  repeated Node nodes = 2;

  // Region is the box the renderer places the root in, for a mod that shares
  // the screen with another, such as a game one mod runs inside another's.
  // Without one, the root fills the screen.
  Region region = 3;
}

// Region is a box on the screen, each side a fraction of the screen's width or
// height from its left or top edge.
message Region {
  // Left is the box's left edge, from 0 to 1.
  float left = 1;

  // Top is the box's top edge, from 0 to 1.
  float top = 2;

  // Width is the box's width, from 0 to 1.
  float width = 3;

  // Height is the box's height, from 0 to 1.
  float height = 4;
}

// Screen is everything one player's renderer draws: each mod's tree.
message Screen {
  // Trees holds one tree per mod that shows this player anything.
  repeated Tree trees = 1;
}

// UiPressEvent reports a press on a button in a player's interface.
message UiPressEvent {
  // Player is the player who pressed.
  int32 player = 1;

  // Node is the id of the pressed button.
  string node = 2;
}

// UiInputEvent reports a change the player made to an input in their
// interface, with the value as the host checked it.
message UiInputEvent {
  // Player is the player who changed it.
  int32 player = 1;

  // Node is the id of the input.
  string node = 2;

  // Value is the input's new value, in the kind its control holds.
  oneof value {
    // Text is a text entry's text.
    string text = 3;

    // Number is a slider's value.
    float number = 4;

    // On is a toggle's state.
    bool on = 5;

    // Choice is the index of a dropdown's chosen option.
    uint32 choice = 6;
  }
}

// UiRequest changes the interface the mod shows one player.
message UiRequest {
  int32 player = 1;

  // Change updates the player's tree.
  Change change = 2;
}
