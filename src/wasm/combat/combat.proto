syntax = "proto3";

package modlock.wasm.combat;

option go_package = "github.com/paralin/modlock/src/wasm/combat;combat";

import "github.com/paralin/modlock/src/geometry/geometry.proto";

// DamageEvent is one hit before the game applies it. Handles are zero when
// the game names no such entity.
message DamageEvent {
  // Victim is the entity taking the hit.
  uint32 victim = 1;

  // Attacker is the entity credited with the hit. Zero makes the hit a
  // hazard, such as poison gas, which credits no one and ignores the
  // inflictor and hit group.
  uint32 attacker = 2;

  // Inflictor is what delivered the hit, such as a projectile.
  uint32 inflictor = 3;

  // Ability is the ability that dealt the hit.
  uint32 ability = 4;

  // Flags are the game's damage flags.
  uint64 flags = 5;

  // HitGroup is the body part hit; 1 is the head and -1 means none.
  int32 hit_group = 6;

  // Amount is the hit's damage before resistances.
  float amount = 7;
}

// DamageResult answers a DamageEvent. An empty result lets the hit through.
message DamageResult {
  // Block cancels the hit's health loss, force, effects and procs.
  optional bool block = 1;

  // Amount replaces the hit's damage when present.
  optional float amount = 2;
}

// DamagedEvent reports one hit the game applied.
message DamagedEvent {
  // Victim is the entity that took the hit.
  uint32 victim = 1;

  // Attacker is the entity credited with the hit, or zero for a hazard.
  uint32 attacker = 2;

  // Ability is the ability that dealt the hit.
  uint32 ability = 3;

  // HealthLost is the health the hit removed, after resistances.
  int32 health_lost = 4;

  // HealthBefore is the victim's health before the hit; a hit that removes
  // all of it kills.
  int32 health_before = 5;

  // Dealt is the hit's damage after resistances, before the victim's health
  // capped it.
  int32 dealt = 6;
}

// KillEvent reports one hero or unit that a hit killed.
message KillEvent {
  // Victim is the entity that died.
  uint32 victim = 1;

  // VictimPlayer is the slot of the player whose hero died, or -1 for a unit.
  int32 victim_player = 2;

  // Attacker is the entity credited with the killing hit, or zero for a
  // hazard.
  uint32 attacker = 3;

  // AttackerPlayer is the slot of the player whose hero is the attacker, or
  // -1. It is the victim's own slot when a hero killed itself.
  int32 attacker_player = 4;

  // Ability is the ability that dealt the killing hit, or zero.
  uint32 ability = 5;
}

// LaunchEvent is a watched projectile's first frame.
message LaunchEvent {
  // Entity is the projectile's entity handle.
  uint32 entity = 1;

  // Name is the projectile's designer name.
  string name = 2;

  // Owner is the entity that fired it, or zero.
  uint32 owner = 3;

  // Player is the slot of the player whose hero fired it, or -1.
  int32 player = 4;

  // Position is where the projectile is.
  modlock.geometry.Vec3 position = 5;
}

// ImpactEvent is a watched projectile striking something.
message ImpactEvent {
  // Entity is the projectile's entity handle.
  uint32 entity = 1;

  // Name is the projectile's designer name.
  string name = 2;

  // Owner is the entity that fired it, or zero.
  uint32 owner = 3;

  // Player is the slot of the player whose hero fired it, or -1.
  int32 player = 4;

  // Start and End are the projectile's movement this frame, which ended in
  // the strike.
  modlock.geometry.Vec3 start = 5;
  modlock.geometry.Vec3 end = 6;

  // Position is where it struck.
  modlock.geometry.Vec3 position = 7;

  // Hit is the entity struck, or zero for the world.
  uint32 hit = 8;
}

// ProjectileOptions selects the projectiles a mod watches.
message ProjectileOptions {
  // Names lists designer names, such as rocket_launcher_rocket_projectile.
  repeated string names = 1;

  // KeepMomentum gives each live hero back the motion it had before a
  // watched projectile's explosion, so the mod's Impact handler sets the
  // push.
  optional bool keep_momentum = 2;
}

// HitOptions describes damage the mod deals.
message HitOptions {
  // Victim is the hero or unit to hurt. The world, props and buildings are
  // refused: the client crashes on their damage events.
  uint32 victim = 1;

  // Attacker is the entity credited with the hit. Without one the hit is a
  // hazard, such as poison gas, which credits no one and ignores the
  // inflictor and hit group.
  optional uint32 attacker = 2;

  // Inflictor is what delivered the hit; the default is the attacker.
  optional uint32 inflictor = 3;

  // Amount is the damage before resistances.
  float amount = 4;

  // HitGroup is the body part hit; 1 is the head. The default is the game's
  // choice.
  optional int32 hit_group = 5;

  // Ability is the entity handle of the ability that dealt the hit, as
  // Ability.entity reports it.
  optional uint32 ability = 6;
}

// KillOptions forces a hero or unit's death through the game's damage path.
message KillOptions {
  // Victim is the hero or unit to kill. World entities, props and buildings
  // are refused because their damage events crash clients.
  uint32 victim = 1;

  // Attacker receives the game's kill credit and rewards. Without an attacker
  // the death is environmental and grants neither credit nor rewards.
  optional uint32 attacker = 2;

  // Inflictor delivered the killing blow; the default is the attacker.
  optional uint32 inflictor = 3;

  // Ability is the ability entity responsible for the kill, when applicable.
  optional uint32 ability = 4;
}

// TraceOptions describes a line to test against the world. Layers are bits
// of the game's collision layers: bit 0 is solid, 2 trigger, 4 player clip,
// 18 player and 19 NPC.
message TraceOptions {
  // Start is where the line begins.
  modlock.geometry.Vec3 start = 1;

  // End is where the line ends.
  modlock.geometry.Vec3 end = 2;

  // Layers selects what the line can hit; the default is solid and
  // hitboxes.
  optional uint64 layers = 3;

  // Exclude removes things in these layers from the hits.
  optional uint64 exclude = 4;

  // Ignore lists entity handles the line passes through.
  repeated uint32 ignore = 5;
}

// TraceResponse holds where a line hit, absent for a miss.
message TraceResponse {
  TraceHit hit = 1;
}

// TraceHit is where a traced line first hit something.
message TraceHit {
  // Position is the hit point.
  modlock.geometry.Vec3 position = 1;

  // Normal is the surface's direction at the hit point.
  modlock.geometry.Vec3 normal = 2;

  // StartSolid is true when the line began inside something solid.
  bool start_solid = 3;

  // Entity is the entity hit, or zero for the world.
  uint32 entity = 4;
}

// ModifierFiredEvent reports one of the game's modifier events the mod
// watches, with the entities the game fired it with. Which of them an event
// fills depends on the event.
message ModifierFiredEvent {
  // Name is the event as the mod named it in StartResult.modifier_events.
  string name = 1;

  // Caster is the entity the event is about, such as the hero that parried
  // or respawned, or zero.
  uint32 caster = 2;

  // Player is the slot of the player whose hero the caster is, or -1.
  int32 player = 3;

  // Target is the other entity of the event, such as the victim of a kill,
  // or zero.
  uint32 target = 4;

  // Ability is the ability or other entity the event names as its source, or
  // zero.
  uint32 ability = 5;
}

// HealEvent reports health an ability, item or lifesteal restored at once to
// a hero or unit. Regeneration reports none, including what abilities such as
// Siphon Life restore as regeneration, and neither do Modlock's own heal and
// a heal at full health.
message HealEvent {
  // Target is the entity healed.
  uint32 target = 1;

  // TargetPlayer is the slot of the player whose hero was healed, or -1 for
  // a unit.
  int32 target_player = 2;

  // Healer is the entity the heal came from, or zero when the game names
  // none.
  uint32 healer = 3;

  // HealerPlayer is the slot of the player whose hero the healer is, or -1.
  int32 healer_player = 4;

  // Ability is the ability or item that healed, or zero.
  uint32 ability = 5;

  // Applied is the health the heal restored.
  int32 applied = 6;

  // Requested is the heal's whole amount; it exceeds applied when the target
  // reached full health.
  int32 requested = 7;
}

// LevelEvent reports a hero reaching a new level.
message LevelEvent {
  // Hero is the hero's entity.
  uint32 hero = 1;

  // Player is the slot of the player whose hero it is, or -1.
  int32 player = 2;

  // Level is the hero's new level.
  int32 level = 3;
}

// MeleeEvent reports one melee swing as the game resolves it.
message MeleeEvent {
  // Attacker is the hero or unit that swung.
  uint32 attacker = 1;

  // AttackerPlayer is the slot of the player whose hero swung, or -1.
  int32 attacker_player = 2;

  // Heavy is true for a charged swing and false for a light one.
  bool heavy = 3;

  // Hits are the entities the swing struck, empty for a miss.
  repeated uint32 hits = 4;
}

// ParryEvent reports a parry that caught a melee swing.
message ParryEvent {
  // Parrier is the hero that parried.
  uint32 parrier = 1;

  // Player is the slot of the player whose hero parried, or -1.
  int32 player = 2;

  // Attacker is the hero or unit whose swing was caught.
  uint32 attacker = 3;

  // AttackerPlayer is the slot of the player whose hero swung, or -1.
  int32 attacker_player = 4;
}
