syntax = "proto2";

// These messages copy the game's own, with its field numbers, from GameTracking:
// https://github.com/SteamTracking/GameTracking-Deadlock/blob/master/Protobufs/gameevents.proto

package modlock.gameinterop.engine;

option go_package = "github.com/paralin/modlock/src/gameinterop/engine;engine";

// SoundStart matches native CMsgSosStartSoundEvent, game event 208.
message SoundStart {
  // Guid names this playing sound to later SoundParams and SoundStop messages.
  optional int32 soundevent_guid = 1;

  // Hash is the sound event name's MurmurHash2, as SoundEventHash computes it.
  optional fixed32 soundevent_hash = 2;

  // SourceEntityIndex is the entity the sound plays on, or -1 for the
  // listener's own position.
  optional int32 source_entity_index = 3 [default = -1];

  // Seed seeds the sound's random choices.
  optional int32 seed = 4;

  // PackedParams holds the sound's public fields, as PackSoundFields packs them.
  optional bytes packed_params = 5;

  // StartTime offsets the sound's start.
  optional float start_time = 6;
}

// SoundStop matches native CMsgSosStopSoundEvent, game event 209.
message SoundStop {
  optional int32 soundevent_guid = 1;
}

// SoundParams matches native CMsgSosSetSoundEventParams, game event 210.
message SoundParams {
  optional int32 soundevent_guid = 1;
  optional bytes packed_params = 5;
}
