syntax = "proto3";

package modlock.publish;

option go_package = "github.com/paralin/modlock/publish;publish";

// The messages of hyperline.gg's publishing API, which modlock publish uses by
// default. Each request and response body is one binary message; the field
// numbers are the service's. The command line also saves Session.

// SignInExchange trades the one-use code the browser handed back, with the
// verifier that proves this command line started the sign-in, for a session.
message SignInExchange {
  // Code is the one-use code from the browser.
  string code = 1;

  // Verifier is the secret whose hash the sign-in page received.
  string verifier = 2;
}

// SignedIn is the session the exchange returns.
message SignedIn {
  // Token is the bearer credential.
  string token = 1;

  // ExpiresAt is the session's expiry in Unix milliseconds.
  int64 expires_at = 2;

  // Account is the signed-in account.
  Account account = 3;
}

// Account names the signed-in player.
message Account {
  // DisplayName is the player's name.
  string display_name = 4;

  // SteamId64 is the player's Steam account.
  uint64 steam_id64 = 6;
}

// Release is a published release as the service reports it.
message Release {
  // Slug is the mod's slug.
  string slug = 1;

  // Version is the release's version.
  string version = 2;

  // Name is the mod's name.
  string name = 3;

  // ReviewState is the release's review decision.
  ReviewState review_state = 10;

  // ReviewNote explains the decision.
  string review_note = 13;
}

// ReviewState is a release's review decision.
enum ReviewState {
  // REVIEW_STATE_UNKNOWN awaits a decision, as PENDING does.
  REVIEW_STATE_UNKNOWN = 0;

  // REVIEW_STATE_PENDING awaits a person's decision.
  REVIEW_STATE_PENDING = 1;

  // REVIEW_STATE_APPROVED may be played.
  REVIEW_STATE_APPROVED = 2;

  // REVIEW_STATE_REJECTED was refused.
  REVIEW_STATE_REJECTED = 3;

  // REVIEW_STATE_APPROVED_FOR_SERVERS may be played on the service's game
  // servers, and on players' PCs once a reviewer approves it.
  REVIEW_STATE_APPROVED_FOR_SERVERS = 4;
}

// Error is a refused request's explanation.
message Error {
  // Code names the refusal for programs.
  string code = 1;

  // Message explains the refusal to the creator.
  string message = 2;
}

// Session is the saved sign-in for one service origin.
message Session {
  // Origin is the service that issued the session.
  string origin = 1;

  // Token is the bearer credential.
  string token = 2;

  // ExpiresAt is the session's expiry in Unix milliseconds.
  int64 expires_at = 3;

  // Name is the signed-in player's name.
  string name = 4;
}

// DevLobbyOpen asks for a dev lobby running the mod a modlock host session
// serves, as the first message on the dev lobby socket. The socket's signing
// key names the host's peer, and the lobby stays open while the socket does.
// A socket from the same peer with the same secret resumes the lobby.
message DevLobbyOpen {
  // ModName is the mod's display name.
  string mod_name = 1;

  // Version is the build's version label.
  string version = 2;

  // Secret admits a guest's game to the host session.
  uint64 secret = 3;

  // Slug is the mod's id from mod.json, which the lobby shows its players
  // beside the name.
  string slug = 4;
}

// DevLobbyState is the service's answer on the dev lobby socket.
message DevLobbyState {
  oneof state {
    // Url is the open lobby's page.
    string url = 1;

    // Refused explains why no lobby opened; the socket closes after it.
    Error refused = 2;
  }

  // Relay is the TURN servers the host session may link through while its
  // lobby is open, unset when the service has none. The service sends the
  // state again with fresh credentials before these expire.
  Relay relay = 3;
}

// Relay is a set of TURN servers and the credentials they share.
message Relay {
  // Servers are the relay servers.
  repeated RelayServer servers = 1;

  // ExpiresAt is when the credentials stop working, in Unix milliseconds.
  int64 expires_at = 2;
}

// RelayServer is one relay server's addresses and credential.
message RelayServer {
  // Urls are the server's STUN and TURN addresses.
  repeated string urls = 1;

  // Username is the credential's identifier.
  string username = 2;

  // Credential is the credential's secret.
  string credential = 3;
}

// DevLobbyJoin asks for the host session of a dev lobby the signed-in player
// is a member of, so their modlock join reaches its game.
message DevLobbyJoin {
  // Lobby is the lobby's ID, from its page's lobby parameter.
  string lobby = 1;
}

// DevLobbyHost names a dev lobby's host session.
message DevLobbyHost {
  // PeerId is the host session's peer.
  string peer_id = 1;

  // Secret admits the guest's game to the host session.
  uint64 secret = 2;
}
