name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build the Windows host
        run: |
          scripts/proton-build.sh
          mkdir -p dist
          (cd build-proton/sdk/bin && zip -r "$GITHUB_WORKSPACE/dist/modlock-host-windows-x64.zip" .)
      - name: Build the TypeScript library
        run: go run ./cmd/modlock-library
      - name: Build the command line
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="modlock-$os-$arch"
            if [ "$os" = windows ]; then name="$name.exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-X main.Version=$GITHUB_REF_NAME" -o "dist/$name" ./cmd/modlock
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Modlock $GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/modlock-*
            js/built
  npm:
    needs: release
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: |
          go run ./cmd/modlock-npm -version "$GITHUB_REF_NAME"
          for dir in dist/npm/*/; do
            if [ "$dir" != dist/npm/modlock/ ]; then npm publish --access public "$dir"; fi
          done
          npm publish --access public dist/npm/modlock
